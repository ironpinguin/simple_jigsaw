# Minimal, Postgres-free stack — SQLite + local filesystem image storage.
# A small install that only needs the app and a mail catcher:
#
#   docker compose -f docker-compose.sqlite.yml up -d --build
#
# The database is a single SQLite file and uploaded images are stored on disk,
# both persisted in the `sqlitedata` volume. For a real deployment set a strong
# AUTH_SECRET and point SMTP_* at a real mail server (then mailpit can be dropped).

# Its own Compose project, so this stack stands beside the Postgres one instead
# of replacing it. Without this key both files default to the directory name and
# share a project: starting this stack in a checkout where `docker compose up`
# is running would adopt and tear down those containers. Renaming the project
# also renames its volume (now `jigsaw-sqlite_sqlitedata`) — see CHANGELOG for
# how to carry an existing one over. (#78)
name: jigsaw-sqlite

services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:/data/app.db
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-secret-change-me-in-production-000000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      # Local filesystem image storage (no object store needed).
      STORAGE_DRIVER: fs
      STORAGE_FS_DIR: /data/storage
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Jigsaw <no-reply@jigsaw.local>}
      # Impressum / privacy policy — .env.example documents what each one says on
      # the page and which three are required.
      LEGAL_NAME: ${LEGAL_NAME:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      LEGAL_PHONE: ${LEGAL_PHONE:-}
      LEGAL_MAIL_PROCESSOR: ${LEGAL_MAIL_PROCESSOR:-}
      LEGAL_STORAGE_PROCESSOR: ${LEGAL_STORAGE_PROCESSOR:-}
      LEGAL_CLASSIFIER_PROCESSOR: ${LEGAL_CLASSIFIER_PROCESSOR:-}
      LEGAL_HOSTING_REGION: ${LEGAL_HOSTING_REGION:-}
      LEGAL_PRIVATE_SERVICE: ${LEGAL_PRIVATE_SERVICE:-}
      # Local NSFW classification (NSFW_MODE=local): where the Dockerfile bakes
      # the model into the production image. Templated like the rest, because a
      # literal here silently ignores the NSFW_MODEL_PATH an operator sets in
      # .env — and .env.example documents it as overridable.
      NSFW_MODEL_PATH: ${NSFW_MODEL_PATH:-/app/models/nsfw.onnx}
      # Image classification on upload — off (default) | local | external; see
      # .env.example for what each variable does. Templated like every other
      # operator-settable variable above rather than commented out: a literal
      # commented line here would do nothing even after being uncommented in
      # .env, since compose only injects variables it declares in this block.
      # NSFW_API_KEY is a secret, so — like AUTH_SECRET and SMTP_PASS — it is
      # read through ${...}, never written inline.
      NSFW_MODE: ${NSFW_MODE:-off}
      NSFW_THRESHOLD: ${NSFW_THRESHOLD:-0.85}
      NSFW_TIMEOUT_MS: ${NSFW_TIMEOUT_MS:-5000}
      NSFW_API_URL: ${NSFW_API_URL:-}
      NSFW_API_KEY: ${NSFW_API_KEY:-}
    volumes:
      - sqlitedata:/data
    # start_period covers `npm run db:push`, which the container's CMD runs
    # before `next start`. `-f` means the dev override never merges into this
    # file, and `name:` above keeps it a separate project besides. /ready rather
    # than /health, because an app
    # that cannot reach the database is not doing its job. (The retention sweep
    # runs on its own timer either way; a probe only brings the next one
    # forward, and never past the hourly budget.)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      mailpit:
        condition: service_started

  # Dev mail catcher (UI on http://localhost:8025). Drop this and use a real
  # SMTP server in production.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI

volumes:
  sqlitedata:
