# Base stack — used as-is for a production-like deployment:
#
#   docker compose -f docker-compose.yml up -d --build
#
# For development, `docker compose up` automatically merges
# docker-compose.override.yml on top (hot-reload dev server, published
# DB/RustFS ports, bind-mounted source).
#
# Object storage is RustFS (S3-compatible); the app talks to it via the standard
# S3 SDK, so nothing app-side changes.
#
# Set a real AUTH_SECRET for any non-local deployment (e.g. in a .env file next
# to this compose file, or your orchestrator's secrets):
#   AUTH_SECRET=$(openssl rand -base64 32)

services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://jigsaw:jigsaw@postgres:5432/jigsaw?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-secret-change-me-in-production-000000}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: jigsaw
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      S3_FORCE_PATH_STYLE: "true"
      # Base URL used to build links in emails.
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Comma-separated allow-list of admin emails (auto-promoted on register/login).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Set to "false" to disable public self-registration (invites still work).
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      # SMTP (dev default points at the mailpit service; set a real server for prod).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Jigsaw <no-reply@jigsaw.local>}
      # Impressum / privacy policy — .env.example documents what each one says on
      # the page and which three are required. Do not restate it here; one
      # authoritative copy is the point.
      LEGAL_NAME: ${LEGAL_NAME:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      LEGAL_PHONE: ${LEGAL_PHONE:-}
      LEGAL_MAIL_PROCESSOR: ${LEGAL_MAIL_PROCESSOR:-}
      LEGAL_STORAGE_PROCESSOR: ${LEGAL_STORAGE_PROCESSOR:-}
      LEGAL_CLASSIFIER_PROCESSOR: ${LEGAL_CLASSIFIER_PROCESSOR:-}
      LEGAL_HOSTING_REGION: ${LEGAL_HOSTING_REGION:-}
      LEGAL_PRIVATE_SERVICE: ${LEGAL_PRIVATE_SERVICE:-}
      # Local NSFW classification (NSFW_MODE=local): where the Dockerfile bakes
      # the model.
      NSFW_MODEL_PATH: /app/models/nsfw.onnx
      # Image classification on upload — off (default) | local | external — and
      # its remaining variables are commented out here so the default stays
      # off; see .env.example for what each one does before uncommenting.
      # NSFW_MODE: external
      # NSFW_THRESHOLD: "0.85"
      # NSFW_TIMEOUT_MS: "5000"
      # external mode only — makes the service a processor, see docs/data-processors.md
      # NSFW_API_URL: ""
      # NSFW_API_KEY: ""
    # start_period covers `npm run db:push`, which the container's CMD runs
    # before `next start`; docker-compose.override.yml replaces that with
    # `prisma generate` + `next dev`, which is slower, so raise it if the dev
    # container reports unhealthy on first boot. /ready rather than /health,
    # because an app that cannot reach the database is not doing its job. (The
    # retention sweep runs on its own timer either way; a probe only brings the
    # next one forward, and never past the hourly budget.)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jigsaw
      POSTGRES_PASSWORD: jigsaw
      POSTGRES_DB: jigsaw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jigsaw -d jigsaw"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfsdata:/data

volumes:
  pgdata:
  rustfsdata:
