# Production-oriented local infrastructure: PostgreSQL + MinIO (S3-compatible).
#
# The app also runs with zero infrastructure using the dev defaults
# (SQLite + local filesystem storage) — see README. Use this compose file when
# you want to exercise the production stack. Requires Docker.
#
#   docker compose up -d
#   # then set in .env:
#   #   DATABASE_URL="postgresql://jigsaw:jigsaw@localhost:5432/jigsaw?schema=public"
#   #   STORAGE_DRIVER="s3"
#   # switch prisma/schema.prisma provider to "postgresql" and run:
#   #   npx prisma migrate deploy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jigsaw
      POSTGRES_PASSWORD: jigsaw
      POSTGRES_DB: jigsaw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
