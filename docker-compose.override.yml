# Development overrides — merged automatically by `docker compose up`.
#
# Runs the app with the `dev` image target (hot-reloading `next dev`), bind-mounts
# the source for live edits, and publishes the Postgres/RustFS ports so host tools
# (psql, the RustFS console) can reach them.
#
#   docker compose up            # dev (this file is applied on top of the base)
#   docker compose up --build    # rebuild images first

services:
  app:
    build:
      context: .
      target: dev
    command: sh -c "npx prisma generate && npx prisma db push --skip-generate && exec npx next dev"
    volumes:
      - .:/app
      # Keep container-built dirs from being shadowed by the bind mount (and keep
      # the container's root-generated Prisma client off the host tree).
      - /app/node_modules
      - /app/.next
      - /app/lib/generated
    environment:
      NODE_ENV: development
    restart: "no"
    depends_on:
      mailpit:
        condition: service_started

  postgres:
    ports:
      - "5432:5432"

  rustfs:
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console

  # Dev mail catcher: SMTP on 1025, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
