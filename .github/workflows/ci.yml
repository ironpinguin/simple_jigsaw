# CI pipeline — quality gates for the jigsaw app.
#
# Gates: lint (ESLint) · test (Vitest) · build (Next.js typecheck+compile) ·
# sast (Semgrep static analysis). Everything runs without a database — the tests
# are pure and the build is dynamic. On a SemVer tag (vX.Y.Z) the release jobs
# also build and push versioned Docker images to the GitHub Container Registry
# and create a GitHub Release.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

# Superseded runs for the same branch/PR are pointless — cancel them. Tag runs
# publish artifacts, so those are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  # The npm the Node jobs install over the one bundled with Node 22 (10.9.x).
  # Raise this when Dependabot's own npm moves past it; see the jobs comment.
  NPM_VERSION: "11"

jobs:
  # Node jobs share the same shape: setup-node caches the npm download folder
  # keyed on package-lock.json, then npm itself is upgraded to $NPM_VERSION, and
  # `npm ci` also runs `prisma generate` via the postinstall hook.
  #
  # The upgrade is not cosmetic. Node 22 bundles npm 10.9.x, which expects
  # nested optional peer entries that npm 11 and later prune when they write a
  # lockfile — for us `node_modules/next-intl/node_modules/@swc/helpers`, an
  # optional peer of the @swc/core under next-intl. Dependabot regenerates
  # package-lock.json with a current npm, so npm 10 read every Dependabot
  # lockfile as out of sync and `npm ci` refused to install at all:
  #
  #   npm error `npm ci` can only install packages when your package.json and
  #   package-lock.json ... are in sync.
  #   npm error Missing: @swc/helpers@0.5.23 from lock file
  #
  # That failed the gates on nine open Dependabot PRs for a reason none of them
  # introduced. npm 11 accepts both shapes of the lockfile, so pinning the npm
  # major here fixes it without changing the Node version the gates test —
  # which stays deliberately matched to the Dockerfile (see #62).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm i -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm i -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npx vitest run --reporter=default --reporter=junit --outputFile=junit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: junit.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm i -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run build

  # Static application security testing with Semgrep (community rulesets, no
  # token required). Fails the job on any finding and uploads SARIF to the
  # repository's code scanning view.
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # codeql-action reads the workflow run via the Actions API; without this
      # the SARIF upload 403s with "Resource not accessible by integration".
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Semgrep scan
        run: >
          semgrep scan
          --config p/typescript --config p/javascript --config p/react
          --config p/nodejs --config p/security-audit --config p/secrets
          --exclude node_modules --exclude .next --exclude lib/generated
          --error --metrics=off
          --sarif --output semgrep.sarif
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
      # Code scanning on a private repo needs GitHub Advanced Security — don't
      # fail the pipeline over it, the scan result above is authoritative. Check
      # this step's log: it is masked as green even when the upload fails.
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  # -------------------------------------------------------------------------
  # Release (tags only): build versioned Docker images and push them to the
  # GitHub Container Registry, then create a GitHub Release.
  # -------------------------------------------------------------------------
  release-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build, sast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # PostgreSQL image: :<version> and :latest
          - db_provider: postgresql
            tag_suffix: ""
          # SQLite image: :<version>-sqlite and :latest-sqlite
          - db_provider: sqlite
            tag_suffix: "-sqlite"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          build-args: |
            DATABASE_PROVIDER=${{ matrix.db_provider }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}${{ matrix.tag_suffix }}
            ghcr.io/${{ github.repository }}:latest${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.db_provider }}
          cache-to: type=gha,mode=max,scope=${{ matrix.db_provider }}

  # Create a GitHub Release for the tag once both images are pushed.
  release-github:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Automated release for $TAG. See CHANGELOG.md for details.

          Images:
          - \`$IMAGE:$TAG\` (PostgreSQL)
          - \`$IMAGE:$TAG-sqlite\` (SQLite)
          EOF
          gh release create "$TAG" --title "Release $TAG" --notes-file notes.md
