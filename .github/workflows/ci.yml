# CI pipeline — quality gates for the jigsaw app.
#
# Gates: lint (ESLint) · test (Vitest) · build (Next.js typecheck+compile) ·
# sast (Semgrep static analysis). Everything runs without a database — the tests
# are pure and the build is dynamic. On a SemVer tag (vX.Y.Z) the release jobs
# also build and push versioned Docker images to the GitHub Container Registry
# and create a GitHub Release.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

# Superseded runs for the same branch/PR are pointless — cancel them. Tag runs
# publish artifacts, so those are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  # Node jobs share the same shape: setup-node reads the version from .nvmrc and
  # caches the npm download folder keyed on package-lock.json, and `npm ci` also
  # runs `prisma generate` via the postinstall hook.
  #
  # .nvmrc is the one place the Node version is written. The Dockerfile keeps a
  # literal `FROM node:<v>-alpine` so Dependabot can still see and bump the base
  # image, and the lint job asserts the two agree — a bump on either side turns
  # a required check red until the other follows. Before this, the gates tested
  # Node 22 while the published images ran Node 26 (see #75).
  #
  # Nothing installs npm over the bundled one any more. Node 26 ships npm
  # 11.19.1, which is the npm major Dependabot writes lockfiles with; on Node 22
  # the bundled npm 10.9.x rejected them outright (#73, worked around in #74).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Required check on purpose: Dependabot bumps the Dockerfile's base image,
      # and this is what stops that from landing while .nvmrc keeps the old
      # major and the gates quietly test the wrong runtime.
      - name: Node version is declared once
        run: |
          nvmrc="$(tr -d '[:space:]' < .nvmrc)"
          docker_major="$(sed -n 's/^FROM node:\([0-9][0-9]*\)-alpine.*/\1/p' Dockerfile | head -1)"
          if [ -z "$docker_major" ]; then
            echo "::error file=Dockerfile::could not read a Node major from the base image line"
            exit 1
          fi
          if [ "$nvmrc" != "$docker_major" ]; then
            echo "::error::.nvmrc says Node $nvmrc, Dockerfile says Node $docker_major — update both"
            exit 1
          fi
          echo "Node $nvmrc in .nvmrc and Dockerfile"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run --reporter=default --reporter=junit --outputFile=junit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: junit.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  # The Dockerfile, which nothing else here reads. lint, test, build and sast all
  # run npm on the runner; before this job a pull request could break the image
  # with every gate green, and the break would surface at release-images — which
  # runs only on a tag, after a tag the release process never moves (#62).
  #
  # Built through compose: docker-compose.yml (postgresql) and
  # docker-compose.sqlite.yml (sqlite) are the two ways the one published image
  # is run, so this cannot drift from what actually ships. Both stacks are
  # started, because since #112 the provider is chosen at container start —
  # an image that builds fine can still fail to boot against either database.
  # Note the -f: a bare `docker compose build` merges
  # docker-compose.override.yml and builds the *dev* target, proving nothing.
  #
  # Paths-filtered, because the gates already cost four jobs per Dependabot PR
  # and most changes cannot affect the image. The filter gates the *steps*, not
  # the job: a job that always runs always reports a conclusion, which is what a
  # required status check needs — an `if`-skipped job reports "skipped" and is
  # counted as a pass, which is a confusing thing to rely on. When nothing
  # relevant changed this job is a checkout and a grep.
  image:
    # Tags are release-images' job; it builds the image and pushes it.
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to diff against the base of the pull request.
          fetch-depth: 0
      - name: Can this change affect the image?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is the branch that gets tagged — building unconditionally"
            exit 0
          fi
          # Everything the image build itself consumes: the recipe, the compose
          # files that define the two variants, the dependency manifests npm ci
          # installs from, and the Prisma schema, its config and the script the
          # build stage runs to generate both clients. App source is already
          # covered by the build job, which runs the same `next build`.
          relevant='^(Dockerfile|\.dockerignore|package\.json|package-lock\.json|docker-compose[^/]*\.ya?ml|prisma/|prisma\.config\.ts|scripts/prisma\.mjs|\.github/workflows/ci\.yml$)'
          changed="$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")"
          if printf '%s\n' "$changed" | grep -qE "$relevant"; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            echo "Image-relevant files changed:"
            printf '%s\n' "$changed" | grep -E "$relevant" | sed 's/^/  /'
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "No image-relevant file changed; not building."
          fi
      - name: Build the image
        if: steps.scope.outputs.affected == 'true'
        run: |
          docker compose -f docker-compose.yml build app
          docker compose -f docker-compose.sqlite.yml build app
      # A build is not a run. The SQLite stack is the leanest end-to-end check
      # available — app plus a mail catcher, no Postgres and no object store —
      # and its healthcheck already polls /api/health/ready, so `--wait`
      # succeeding means the container came up, `db:push` ran and the app can
      # reach its database.
      - name: Start the SQLite stack and wait for it to be healthy
        if: steps.scope.outputs.affected == 'true'
        run: |
          docker compose -f docker-compose.sqlite.yml up -d --wait --wait-timeout 180
          curl -sf --retry 3 http://localhost:3000/api/health/ready
      - name: Tear down the SQLite stack
        if: steps.scope.outputs.affected == 'true'
        run: docker compose -f docker-compose.sqlite.yml down -v
      # The same image against Postgres. Both stacks bind port 3000, hence one
      # after the other.
      - name: Start the Postgres stack and wait for it to be healthy
        if: steps.scope.outputs.affected == 'true'
        run: |
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 180
          curl -sf --retry 3 http://localhost:3000/api/health/ready
      - name: Container logs, if a stack did not come up
        if: failure() && steps.scope.outputs.affected == 'true'
        run: |
          docker compose -f docker-compose.sqlite.yml logs --no-color --tail 80
          docker compose -f docker-compose.yml logs --no-color --tail 80
      - name: Tear down
        if: always() && steps.scope.outputs.affected == 'true'
        run: |
          docker compose -f docker-compose.sqlite.yml down -v
          docker compose -f docker-compose.yml down -v

  # Static application security testing with Semgrep (community rulesets, no
  # token required). Fails the job on any finding and uploads SARIF to the
  # repository's code scanning view.
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # codeql-action reads the workflow run via the Actions API; without this
      # the SARIF upload 403s with "Resource not accessible by integration".
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Semgrep scan
        run: >
          semgrep scan
          --config p/typescript --config p/javascript --config p/react
          --config p/nodejs --config p/security-audit --config p/secrets
          --exclude node_modules --exclude .next --exclude lib/generated
          --error --metrics=off
          --sarif --output semgrep.sarif
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
      # Code scanning on a private repo needs GitHub Advanced Security — don't
      # fail the pipeline over it, the scan result above is authoritative. Check
      # this step's log: it is masked as green even when the upload fails.
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  # -------------------------------------------------------------------------
  # Release (tags only): build the versioned Docker image and push it to the
  # GitHub Container Registry, then create a GitHub Release.
  # -------------------------------------------------------------------------
  release-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build, sast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          # One image for both databases since #112; DATABASE_PROVIDER picks one
          # at container start. The -sqlite tags are the same image, kept so
          # that installs pinned to :latest-sqlite keep updating — they already
          # set DATABASE_PROVIDER=sqlite, which is all the image needs.
          # Deprecated in the release after 0.7.0; drop these two lines in a
          # later one, together with the -sqlite line in release-github.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-sqlite
            ghcr.io/${{ github.repository }}:latest-sqlite
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

  # Create a GitHub Release for the tag once the image is pushed.
  release-github:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          REPO: ${{ github.repository }}
        run: |
          # Linked at the tag rather than on main: the release page has to keep
          # describing *this* release once later ones have landed. No per-version
          # anchor — the changelog headings carry the release date, which the tag
          # alone does not give us.
          cat > notes.md <<EOF
          Automated release for $TAG.
          See the [changelog](https://github.com/$REPO/blob/$TAG/CHANGELOG.md) for everything in this release.

          Image: \`$IMAGE:$TAG\` — PostgreSQL or SQLite, chosen with
          \`DATABASE_PROVIDER\` at container start. \`$IMAGE:$TAG-sqlite\` is
          the same image, deprecated and kept for existing SQLite installs.
          EOF
          gh release create "$TAG" --title "Release $TAG" --notes-file notes.md
