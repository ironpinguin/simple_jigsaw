# Dependency updates. Free for public repositories, and the reason this file
# exists: three of the advisories closed in 0.5.0 sat in transitive dependencies
# where nothing would have surfaced them without an alert.
#
# Weekly, and grouped where grouping helps — the quality gates (lint · test ·
# build · sast) run on every one of these PRs, so a daily ungrouped schedule
# would spend more CI time than the updates are worth. Majors are the exception
# and get their own PR each; see the npm block.
version: 2
updates:
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Doubles as the throttle on ungrouped majors: they queue rather than all
    # opening at once, and the next one appears as one is merged or closed.
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps are the boring majority; one PR a week for the lot
      # keeps them reviewable together and keeps the lockfile churn in one place.
      minor-and-patch:
        update-types: [minor, patch]
      # Majors are deliberately NOT grouped. Anything left out of a group gets
      # its own pull request, which is what we want here: Next.js, Prisma and
      # Auth.js majors carry migration notes, and they need to be reviewed —
      # and revertable — one at a time.
      #
      # An earlier revision did group them, on the theory that it kept a
      # breaking change from being waved through next to twelve patch bumps.
      # The first run disproved it: thirteen accumulated majors arrived as a
      # single PR (#61), which is not reviewable at all. Grouping majors only
      # looks tidy while there are none pending.
    ignore:
      # Pinned to whatever next-intl depends on rather than to the newest
      # release. This devDependency exists for one reason: so that
      # lib/accept-language.negotiation.test.ts can compare our locale matcher
      # against *the same copy* next-intl resolves. A range npm cannot dedupe
      # with next-intl's nests a second copy, and the test then refuses to run
      # — correctly, since it would be comparing two different matchers.
      #
      # 0.x ranges do not cross minor versions, so ^0.9.0 and next-intl's
      # ^0.8.1 cannot share an install. Lift this when next-intl itself moves
      # to 0.9; the test is the backstop either way, and it caught exactly this
      # in the group PR that introduced the rule.
      - dependency-name: "@formatjs/intl-localematcher"
        versions: [">=0.9.0"]
    labels: [dependencies]

  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]

  # ---------------------------------------------------------------------------
  # The runtime image. Both published variants (PostgreSQL and SQLite) are built
  # from this one Dockerfile via the DATABASE_PROVIDER build arg, so a base image
  # bump here reaches both.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
