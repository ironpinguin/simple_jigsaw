# CI pipeline — quality gates for the jigsaw app.
#
# Adding this file REPLACES GitLab's auto-generated (Auto DevOps) pipeline.
# Gates: lint (ESLint) · test (Vitest) · build (Next.js typecheck+compile) ·
# sast (Semgrep static analysis). Everything runs without a database — the tests
# are pure and the build is dynamic. On a SemVer tag (vX.Y.Z) the release stage
# also builds and pushes versioned Docker images to the Container Registry.

stages:
  - quality
  - test
  - build
  - release

# Run for tags, merge requests, and branch pushes (but not a branch push while a
# merge request is open for it).
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

# Node jobs share an install step (npm ci also runs `prisma generate` via the
# postinstall hook) and cache the npm download folder.
.node:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

lint:
  extends: .node
  stage: quality
  script:
    - npm run lint

test:
  extends: .node
  stage: test
  script:
    - npx vitest run --reporter=default --reporter=junit --outputFile=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml

build:
  extends: .node
  stage: build
  script:
    - npm run build

# Static application security testing with Semgrep (community rulesets, no token
# required). Produces a GitLab SAST report and fails the job on any finding.
sast:
  stage: quality
  # entrypoint must be cleared so GitLab can run its shell-based job script in
  # the semgrep tool image.
  image:
    name: semgrep/semgrep
    entrypoint: [""]
  before_script: []
  cache: {}
  script:
    # The image sets SEMGREP_IN_DOCKER, which makes `semgrep scan` insist on a
    # `-v $PWD:/src` mount. GitLab checks out into /builds instead, so /src is
    # empty and the scan aborts — dropping the variable disables that check.
    - >
      env -u SEMGREP_IN_DOCKER
      semgrep scan
      --config p/typescript --config p/javascript --config p/react
      --config p/nodejs --config p/security-audit --config p/secrets
      --exclude node_modules --exclude .next --exclude lib/generated
      --error --metrics=off
      --gitlab-sast --output gl-sast-report.json
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json

# ---------------------------------------------------------------------------
# Release (tags only): build versioned Docker images and push them to the
# GitLab Container Registry. Uses Kaniko so no privileged/DinD runner is needed.
# Requires the project's Container Registry to be enabled.
# ---------------------------------------------------------------------------
.release-image:
  stage: release
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  cache: {}
  before_script: []
  # Build the image variants one at a time — two parallel Kaniko + Next builds
  # exhaust the runner's memory.
  resource_group: release-images
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --target runner
      --build-arg "DATABASE_PROVIDER=$DB_PROVIDER"
      --destination "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG}${TAG_SUFFIX}"
      --destination "$CI_REGISTRY_IMAGE:latest${TAG_SUFFIX}"

# PostgreSQL image: :<version> and :latest
release:postgres:
  extends: .release-image
  variables:
    DB_PROVIDER: postgresql
    TAG_SUFFIX: ""

# SQLite image: :<version>-sqlite and :latest-sqlite
release:sqlite:
  extends: .release-image
  variables:
    DB_PROVIDER: sqlite
    TAG_SUFFIX: "-sqlite"

# Create a GitLab Release for the tag once both images are pushed.
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  cache: {}
  before_script: []
  needs:
    - release:postgres
    - release:sqlite
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: |
      Automated release for $CI_COMMIT_TAG. See CHANGELOG.md for details.

      Images:
      - `$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG` (PostgreSQL)
      - `$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-sqlite` (SQLite)
